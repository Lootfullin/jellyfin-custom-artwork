name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build, test and verify package
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          $packageVersion = if ($tagVersion -match '^\d+\.\d+\.\d+$') {
            "$tagVersion.0"
          } else {
            $tagVersion
          }
          ./build-package.ps1 -Version $packageVersion
      - uses: softprops/action-gh-release@v3
        with:
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/Cowabunga.Custom.Artwork_*.zip
            artifacts/Cowabunga.Custom.Artwork_*.zip.sha256
