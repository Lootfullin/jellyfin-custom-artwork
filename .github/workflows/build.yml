name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/Jellyfin.Plugin.CustomArtwork.Tests/Jellyfin.Plugin.CustomArtwork.Tests.csproj

      - name: Check formatting
        run: dotnet format tests/Jellyfin.Plugin.CustomArtwork.Tests/Jellyfin.Plugin.CustomArtwork.Tests.csproj --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.CustomArtwork.Tests/Jellyfin.Plugin.CustomArtwork.Tests.csproj --configuration Release --no-restore

      - name: Build and verify release package
        shell: pwsh
        run: ./build-package.ps1

      - name: Validate plugin catalog
        shell: pwsh
        run: |
          $catalog = Get-Content manifest.json -Raw | ConvertFrom-Json
          if ($catalog.Count -ne 1 -or @($catalog[0].versions).Count -lt 1) {
            throw 'Catalog must contain one plugin with at least one version.'
          }

          $versions = @($catalog[0].versions)
          $versionNumbers = @($versions | ForEach-Object { [version]$_.version })
          if (($versionNumbers | Sort-Object -Unique).Count -ne $versionNumbers.Count) {
            throw 'Catalog versions must be unique.'
          }

          $latest = $versionNumbers | Sort-Object -Descending | Select-Object -First 1
          if ([version]$versions[0].version -ne $latest) {
            throw 'The newest catalog version must be listed first.'
          }
